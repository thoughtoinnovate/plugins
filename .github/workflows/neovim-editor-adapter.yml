name: Neovim Editor Adapter Tests

on:
  push:
    paths:
      - 'tark/editors/neovim/**'
      - '.github/workflows/neovim-editor-adapter.yml'
  pull_request:
    paths:
      - 'tark/editors/neovim/**'
      - '.github/workflows/neovim-editor-adapter.yml'

jobs:
  nvim-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tark/editors/neovim
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plenary.nvim
        run: |
          mkdir -p "$HOME/.local/share/nvim"
          PLENARY_DIR="$HOME/.local/share/nvim/plenary.nvim"
          if [ ! -d "$PLENARY_DIR" ]; then
            git clone --depth=1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_DIR"
          fi

      - name: Run Neovim unit tests
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/specs/ {minimal_init = 'tests/minimal_init.lua'}"

  nvim-headless-e2e:
    runs-on: ubuntu-latest
    needs: [nvim-unit]
    defaults:
      run:
        working-directory: tark/editors/neovim
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install plenary.nvim
        run: |
          mkdir -p "$HOME/.local/share/nvim"
          PLENARY_DIR="$HOME/.local/share/nvim/plenary.nvim"
          if [ ! -d "$PLENARY_DIR" ]; then
            git clone --depth=1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_DIR"
          fi
      - name: ACP headless smoke
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "lua require('tark').setup({auto_download=false, lsp={enabled=false}, ghost={enabled=false}})" \
            -c "lua require('tark').chat_open()" \
            -c "qa!"

  compat-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tark/editors/neovim
    steps:
      - uses: actions/checkout@v4
      - name: Validate README compatibility note
        run: |
          rg -n "ACP v2|Content-Length" README.md

  nvim-profile-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [codex, gemini, jetbrains]
    defaults:
      run:
        working-directory: tark/editors/neovim
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install plenary.nvim
        run: |
          mkdir -p "$HOME/.local/share/nvim"
          PLENARY_DIR="$HOME/.local/share/nvim/plenary.nvim"
          if [ ! -d "$PLENARY_DIR" ]; then
            git clone --depth=1 https://github.com/nvim-lua/plenary.nvim "$PLENARY_DIR"
          fi
      - name: Run ACP profile tests (${{ matrix.profile }})
        env:
          ACP_TEST_PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/specs/ {minimal_init = 'tests/minimal_init.lua'}" \
            2>&1 | tee acp-profile-${{ matrix.profile }}.log
      - name: Upload ACP profile transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-acp-profile-${{ matrix.profile }}
          path: tark/editors/neovim/acp-profile-${{ matrix.profile }}.log
          if-no-files-found: ignore
